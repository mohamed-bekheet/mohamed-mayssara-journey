<!DOCTYPE html>
<html>
<head>
  <title>Our Journey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; 
      margin-top: 25vh; 
      background-color: #fcfaf8; /* Soft, warm background */
      color: #333; 
    }
    .card {
      background: white;
      padding: 40px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* Soft shadow for depth */
      display: inline-block;
      max-width: 90%;
      width: 350px;
    }
    h1 { 
      font-size: 5rem; 
      color: #b76e79; /* Elegant rose gold/mauve color */
      margin: 15px 0; 
    }
    p { 
      font-size: 1.3rem; 
      margin: 5px; 
      color: #555;
    }
    .highlight {
      font-weight: bold;
      color: #222;
    }
  </style>
</head>
<body>
  
  <div class="card">
    <p>It has been</p>
    <h1 id="days-counter">...</h1>
    <p>days since our <span class="highlight">Qrayet El Fatiha</span></p>
  </div>

  <script>
    // Qrayet El Fatiha Date: September 24, 2026
    const ceremonyDate = new Date("2026-09-24T00:00:00"); 

    function updateCounter() {
      const today = new Date();
      
      // Calculate the difference in milliseconds
      const diffTime = today - ceremonyDate;
      
      // Convert milliseconds to days (Math.max prevents negative numbers just in case)
      const diffDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
      
      document.getElementById('days-counter').innerText = diffDays;
    }

    updateCounter();
  </script>
</body>
</html>
